# Legt automatisch GitHub-Releases an.
# Ausloeser: jeder Push auf main, der den Ordner releases/ aendert (oder manueller Start).
# Fuer jeden Ordner releases/<Version>/ ohne passendes Release wird das Release "v<Version>"
# erstellt (der Tag wird dabei automatisch gesetzt). Dateien: alle .bin und .zip im Ordner,
# Text: releases/<Version>/LIESMICH.md. Die neueste Version wird als "Latest" markiert.
name: Release erstellen

on:
  push:
    branches: [main]
    paths: ["releases/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Releases fuer neue Versionsordner anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(ls -1 releases | sort -V | tail -1)
          for VER in $(ls -1 releases | sort -V); do
            DIR="releases/${VER}"
            TAG="v${VER}"
            [ -d "$DIR" ] || continue
            ls "$DIR"/*.bin >/dev/null 2>&1 || { echo "$DIR: keine .bin, uebersprungen"; continue; }
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "$TAG: Release vorhanden, Dateien werden aktualisiert"
              gh release upload "$TAG" "$DIR"/*.bin "$DIR"/*.zip --clobber
              gh release edit "$TAG" --title "Firmware ${VER}" --notes-file "$DIR/LIESMICH.md"
            else
              echo "$TAG: neues Release"
              FLAG=""
              [ "$VER" = "$LATEST" ] && FLAG="--latest"
              gh release create "$TAG" "$DIR"/*.bin "$DIR"/*.zip \
                --target "$GITHUB_SHA" --title "Firmware ${VER}" --notes-file "$DIR/LIESMICH.md" $FLAG
            fi
          done
